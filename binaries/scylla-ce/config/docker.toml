[server]
# One listener for everything: web UI, gRPC, gRPC-Web, reflection, and the
# inbound webhook ingress (POST /webhooks/{trigger_id}).
address = "0.0.0.0:8080"
# The origin of the reset links. Without mail, the link is in the server log.
public_url = "http://localhost:8080"

[webhook]
# Base URL advertised in TriggerView.webhook_url (override for a real domain).
public_base_url = "http://localhost:8080"

[database]
url = "postgres://scylla:scylla@postgres:5432/scylla"
max_connections = 16
min_connections = 1
acquire_timeout = "30s"
run_migrations = true

# The UI is same-origin now, so CORS is only for the scylla-web dev server on :5173 and for
# third-party API clients.
[cors]
allow_origins = ["http://localhost:5173"]
allow_headers = [
    "content-type",
    "authorization",
    "x-grpc-web",
    "x-user-agent"
]
expose_headers = [
    "grpc-status",
    "grpc-message",
    "grpc-status-details-bin"
]

[bootstrap]
username = "admin"
password = "admin123"
email = "admin@example.com"

[secrets]
# Dev-only master key for project-secret encryption. Replace + inject at deploy.
master_key = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
