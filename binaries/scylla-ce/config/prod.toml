[server]
# One listener for everything: web UI, gRPC, gRPC-Web, reflection, and the
# inbound webhook ingress. Terminate TLS in front, or set [server.tls].
address = "0.0.0.0:8080"
# The public origin of this instance, without a trailing slash. The reset links
# start with it. Without mail, the link is in the server log.
public_url = "https://your-domain.example.com"
# A session records the IP address of the client that signed in. False: the
# peer address of the connection. True: the first entry of x-forwarded-for,
# else x-real-ip. Set true only behind a reverse proxy that sets these headers
# and replaces the values that a client sends: a client can write them.
trust_forwarded_headers = false

# Terminate TLS here instead of upstream. Both HTTP/2 and HTTP/1.1 are offered
# over ALPN, so browsers, gRPC clients and plain webhook senders all connect.
# [server.tls]
# cert = "/etc/scylla/tls/fullchain.pem"
# key  = "/etc/scylla/tls/privkey.pem"

[webhook]
# Base URL advertised in TriggerView.webhook_url. Set it to the public origin of
# this instance, or webhook triggers show an empty URL in the UI.
public_base_url = "https://your-domain.example.com"

[database]
# Override at deploy time, e.g. via DATABASE_URL env injected into the container.
url = "postgres://scylla:scylla@postgres:5432/scylla"
max_connections = 32
min_connections = 4
acquire_timeout = "30s"
run_migrations = true

# The UI is served from this same origin, so CORS is only for third-party API
# clients. Leave allow_origins empty if there are none.
[cors]
allow_origins = ["https://your-domain.example.com"]
allow_methods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
allow_headers = ["content-type", "authorization"]
max_age_seconds = 3600
