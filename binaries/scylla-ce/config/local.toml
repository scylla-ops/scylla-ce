[server]
# One listener for everything: web UI, gRPC, gRPC-Web, reflection, webhooks.
address = "127.0.0.1:8080"
# The origin of the reset links. Without mail, the link is in the server log.
public_url = "http://127.0.0.1:8080"

[ui]
# Host-native dev runs the UI on Vite (:5173), so there is no dist/ to serve.
# `--no-ui` on the command line does the same thing without editing this file.
enabled = false

[database]
url = "postgres://scylla:scylla@127.0.0.1:5432/scylla"
max_connections = 8
min_connections = 1
acquire_timeout = "30s"
run_migrations = true

# Only needed because the scylla-web dev server serves the UI from :5173, a different origin.
# A deployed instance serves both from one origin and needs none of this.
[cors]
allow_origins = ["*"]
allow_headers = [
    "content-type",
    "authorization",
    "x-grpc-web",
    "x-user-agent"
]
expose_headers = [
    "grpc-status",
    "grpc-message",
    "grpc-status-details-bin"
]

[bootstrap]
username = "admin"
password = "admin123"
email = "admin@example.com"

[secrets]
# Dev-only master key for project-secret encryption. Replace + inject at deploy.
master_key = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
