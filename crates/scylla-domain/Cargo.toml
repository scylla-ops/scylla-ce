[package]
name = "scylla-domain"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true

# No features, and no heavy dependencies. This crate is shared by the control
# plane and by every agent, so anything that opens a socket, talks to a database
# or does crypto belongs in scylla-core (or scylla-db), not here. See src/lib.rs.
[dependencies]
serde = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
derive-where = { workspace = true }
nutype = { workspace = true }
ulid = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Only the golden tests that pin the JSONB on-disk shapes need to parse JSON.
serde_json = { workspace = true }

[lints]
workspace = true
