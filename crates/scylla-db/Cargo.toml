[package]
name = "scylla-db"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true

# This package lives exactly two directories below the workspace root, and that
# depth is load-bearing: `sqlx::migrate!("../../migrations")` and every
# `#[sqlx::test(migrations = "../../migrations")]` resolve against
# CARGO_MANIFEST_DIR. Moving it one level deeper silently breaks all of them.

[features]
# Exposes the `test_support` seeders (and, through scylla-core, the builders and
# doubles) to downstream test code.
test-utils = ["scylla-core/test-utils"]

[dependencies]
# the shared kernel: domain model
scylla-domain = { workspace = true }
# the access model: the grant, role, audit and entity-provider ports
scylla-auth = { workspace = true }
# the repository ports these adapters implement
scylla-core = { workspace = true }

sqlx.workspace = true
# PgAuditLog spawns its writer task at construction
tokio.workspace = true
async-trait.workspace = true
chrono.workspace = true
tracing.workspace = true

[dev-dependencies]
scylla-core = { workspace = true, features = ["test-utils"] }
# tests drive project writes through the pipeline with a test policy in the hooks
scylla-extension = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
