syntax = "proto3";

package scylla.accounts.v1;

import "google/protobuf/timestamp.proto";
import "scylla/accounts/v1/user.proto";
import "scylla/common/v1/id.proto";

// The account of the caller: its profile, its email, its password, its identities and its
// sessions. Each RPC needs the token of a user, else UNAUTHENTICATED or PERMISSION_DENIED.
service ProfileService {
  // Returns the user of the caller, with its handle and its instance admin flag.
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
  // Changes the display name or the handle. A handle of another user gives
  // FAILED_PRECONDITION with the reason HANDLE_IN_USE.
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  // Deletes the account. It needs the current password if the user has one. A workspace where
  // the user is the only owner is deleted with the account if it is empty. Else the request
  // gives FAILED_PRECONDITION with the reason LAST_OWNER, and the ErrorInfo metadata
  // "workspace_ids" names those workspaces. The last active instance admin gives LAST_ADMIN.
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);
  // Sends a link to the new email, after the answer. It needs the current password if the user
  // has one. The answer is the same if an account uses the email, and the server sends at most
  // one link each 60 seconds for one user and for one email.
  rpc RequestEmailChange(RequestEmailChangeRequest) returns (RequestEmailChangeResponse);
  // Makes the new email the primary verified email, with the token of the link. Each other open
  // link of the user stops: a link to the old email does not work any more. The old email gets a
  // notice.
  rpc ConfirmEmailChange(ConfirmEmailChangeRequest) returns (ConfirmEmailChangeResponse);
  // Changes the password. It needs the current password if the user has one, and closes the
  // other sessions.
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  // Lists the identities of the user at the identity providers.
  rpc ListIdentities(ListIdentitiesRequest) returns (ListIdentitiesResponse);
  // Removes an identity. The last way to sign in cannot be removed: FAILED_PRECONDITION.
  rpc UnlinkIdentity(UnlinkIdentityRequest) returns (UnlinkIdentityResponse);
  // Lists the open sessions of the user, newest first.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // Closes one session of the user. Its tokens stop at once.
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);
  // Closes each session of the user, except the session of the request.
  rpc RevokeOtherSessions(RevokeOtherSessionsRequest) returns (RevokeOtherSessionsResponse);
}

// The input of GetMe.
message GetMeRequest {}

// The output of GetMe.
message GetMeResponse {
  // The user of the caller.
  User user = 1;
}

// The input of UpdateProfile. A field that is not set does not change.
message UpdateProfileRequest {
  // The new display name, 1 to 100 characters after trim.
  optional string display_name = 1;
  // The new handle: 2 to 39 lower case letters, digits, dots, dashes or underscores, that start
  // with a letter or a digit. An empty text removes the handle.
  optional string handle = 2;
}

// The output of UpdateProfile.
message UpdateProfileResponse {
  // The user after the change.
  User user = 1;
}

// The input of DeleteAccount.
message DeleteAccountRequest {
  // The current password. Required if the user has a password.
  string password = 1;
}

// The output of DeleteAccount.
message DeleteAccountResponse {}

// The input of RequestEmailChange.
message RequestEmailChangeRequest {
  // The new email address.
  string new_email = 1;
  // The current password. Required if the user has a password.
  string password = 2;
}

// The output of RequestEmailChange. It is the same for a free and a used email.
message RequestEmailChangeResponse {}

// The input of ConfirmEmailChange.
message ConfirmEmailChangeRequest {
  // The token of the link in the mail.
  string token = 1;
}

// The output of ConfirmEmailChange.
message ConfirmEmailChangeResponse {
  // The user after the change.
  User user = 1;
}

// The input of ChangePassword.
message ChangePasswordRequest {
  // The current password. Required if the user has a password.
  string current_password = 1;
  // The new password, 8 to 128 characters.
  string new_password = 2;
}

// The output of ChangePassword.
message ChangePasswordResponse {}

// The input of ListIdentities.
message ListIdentitiesRequest {}

// The output of ListIdentities.
message ListIdentitiesResponse {
  // The identities of the user.
  repeated Identity identities = 1;
  // True if the user can also sign in with a password.
  bool has_password = 2;
}

// An identity of a user at an identity provider.
message Identity {
  // The slug of the provider.
  string provider = 1;
  // The id of the person at the provider.
  string subject = 2;
  // The email that the provider gave, if any.
  string email = 3;
  // The time of the link.
  google.protobuf.Timestamp linked_at = 4;
}

// The input of UnlinkIdentity.
message UnlinkIdentityRequest {
  // The slug of the provider.
  string provider = 1;
  // The id of the person at the provider.
  string subject = 2;
}

// The output of UnlinkIdentity.
message UnlinkIdentityResponse {}

// The input of ListSessions.
message ListSessionsRequest {}

// The output of ListSessions.
message ListSessionsResponse {
  // The open sessions, newest first.
  repeated Session sessions = 1;
}

// The input of RevokeSession.
message RevokeSessionRequest {
  // The session to close. Required.
  scylla.common.v1.Id session_id = 1;
}

// The output of RevokeSession.
message RevokeSessionResponse {}

// The input of RevokeOtherSessions.
message RevokeOtherSessionsRequest {}

// The output of RevokeOtherSessions.
message RevokeOtherSessionsResponse {}
