syntax = "proto3";

package scylla.accounts.v1;

import "scylla/auth/v1/token_service.proto";

// Creates the accounts that sign in with a password, and signs them in. Its RPCs need no
// token. An unknown email gets the same answer as a known one, so no caller learns which
// accounts exist.
service AccountService {
  // Creates a user that signs in with a password. With an invitation, the email is verified
  // and the invitation is accepted. Else the server sends a link to verify the email. The
  // sign-up mode of the server can refuse it with FAILED_PRECONDITION.
  rpc SignUp(SignUpRequest) returns (SignUpResponse);
  // Verifies the email of a new user with the token of the link, and activates the user.
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse);
  // Signs in with an email and a password, and opens a session.
  rpc SignIn(SignInRequest) returns (SignInResponse);
  // Sends a link to reset the password, if the email has an account.
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse);
  // Sets a new password with the token of the link. It closes each session of the user.
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
  // Lists the ways to sign in: the identity providers that are on, and the sign-up mode.
  rpc ListSignInMethods(ListSignInMethodsRequest) returns (ListSignInMethodsResponse);
}

// The input of SignUp.
message SignUpRequest {
  // The email address. Required.
  string email = 1;
  // The password, 15 to 128 characters.
  string password = 2;
  // The display name, 1 to 100 characters after trim.
  string display_name = 3;
  // The token of an invitation link, if the user has one.
  string invitation_token = 4;
}

// The output of SignUp. It is the same for a new email and for a known email.
message SignUpResponse {}

// The input of VerifyEmail.
message VerifyEmailRequest {
  // The token of the link in the mail.
  string token = 1;
}

// The output of VerifyEmail.
message VerifyEmailResponse {}

// The input of SignIn.
message SignInRequest {
  // The email address.
  string email = 1;
  // The password.
  string password = 2;
  // Puts the refresh token in an HttpOnly cookie for a browser, in place of the response.
  bool cookie = 3;
}

// The output of SignIn.
message SignInResponse {
  // The access token.
  scylla.auth.v1.IssuedToken token = 1;
  // The refresh token of the session. Empty when the cookie holds it.
  string refresh_token = 2;
}

// The input of RequestPasswordReset.
message RequestPasswordResetRequest {
  // The email address.
  string email = 1;
}

// The output of RequestPasswordReset. It is the same for a known and an unknown email.
message RequestPasswordResetResponse {}

// The input of ResetPassword.
message ResetPasswordRequest {
  // The token of the link in the mail.
  string token = 1;
  // The new password, 15 to 128 characters.
  string password = 2;
}

// The output of ResetPassword.
message ResetPasswordResponse {}

// The input of ListSignInMethods.
message ListSignInMethodsRequest {}

// The output of ListSignInMethods.
message ListSignInMethodsResponse {
  // The identity providers that are on, in slug order.
  repeated SignInProvider providers = 1;
  // The sign-up mode of the server: open, invite_only or closed.
  string sign_up_mode = 2;
}

// An identity provider on the sign-in page.
message SignInProvider {
  // The key of the provider in the URL: /auth/<slug>/start.
  string slug = 1;
  // The name to show.
  string display_name = 2;
  // The kind: oidc or github.
  string kind = 3;
}
