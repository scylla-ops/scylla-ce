syntax = "proto3";

package scylla.workspaces.v1;

import "scylla/common/v1/id.proto";
import "scylla/common/v1/page.proto";
import "scylla/workspaces/v1/workspace.proto";

// Creates, reads, changes, deletes and lists workspaces, and changes their owners. Each RPC
// needs an authenticated actor, else UNAUTHENTICATED. An unknown workspace gives
// PERMISSION_DENIED, as a refusal does.
service WorkspaceService {
  // Creates a workspace. The caller becomes its first owner. Only a user can own a workspace,
  // else PERMISSION_DENIED. A slug in use gives FAILED_PRECONDITION with the reason
  // SLUG_IN_USE.
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (CreateWorkspaceResponse);
  // Reads one workspace, by its id or by its slug. A slug is public. An unknown slug gives
  // PERMISSION_DENIED, as a refusal does.
  rpc GetWorkspace(GetWorkspaceRequest) returns (GetWorkspaceResponse);
  // Lists the workspaces that the caller can read, oldest first: the workspaces that it owns,
  // and the workspaces where it has a role.
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  // Changes the name or the slug of a workspace. The caller needs the permission
  // update_workspace: its owners and its admins. A slug in use gives FAILED_PRECONDITION with
  // the reason SLUG_IN_USE.
  rpc UpdateWorkspace(UpdateWorkspaceRequest) returns (UpdateWorkspaceResponse);
  // Deletes a workspace, with its owners and its invitations. Only an owner can do it, else
  // PERMISSION_DENIED: no role gives this right. A workspace with a project or an agent gives
  // FAILED_PRECONDITION with the reason WORKSPACE_NOT_EMPTY.
  rpc DeleteWorkspace(DeleteWorkspaceRequest) returns (DeleteWorkspaceResponse);
  // Makes a user an owner of a workspace. Only an owner can do it, else PERMISSION_DENIED: no
  // role gives this right. An unknown user gives NOT_FOUND. An owner stays an owner.
  rpc AddOwner(AddOwnerRequest) returns (AddOwnerResponse);
  // Takes an owner out of a workspace, for example the caller itself. Only an owner can do it,
  // else PERMISSION_DENIED. The last owner stays: FAILED_PRECONDITION with the reason
  // LAST_OWNER. A user that is not an owner changes nothing.
  rpc RemoveOwner(RemoveOwnerRequest) returns (RemoveOwnerResponse);
  // Lists the owners of a workspace, in user id order. A reader of the workspace can do it.
  rpc ListOwners(ListOwnersRequest) returns (ListOwnersResponse);
}

// The input of CreateWorkspace.
message CreateWorkspaceRequest {
  // The display name, 1 to 100 characters after trim.
  string name = 1;
  // The slug, trimmed and in lower case. A route of the app, for example login, is reserved.
  // If it is not set, the server makes one from the name, with a suffix -2, -3 and on if the
  // slug is in use or reserved.
  optional string slug = 2;
}

// The output of CreateWorkspace.
message CreateWorkspaceResponse {
  // The created workspace.
  Workspace workspace = 1;
}

// The input of GetWorkspace. One of the fields is required.
message GetWorkspaceRequest {
  // How the request names the workspace.
  oneof workspace {
    // The id of the workspace.
    scylla.common.v1.Id workspace_id = 1;
    // The slug of the workspace, in any case.
    string slug = 2;
  }
}

// The output of GetWorkspace.
message GetWorkspaceResponse {
  // The workspace.
  Workspace workspace = 1;
}

// The input of ListWorkspaces.
message ListWorkspacesRequest {
  // The page to return.
  scylla.common.v1.PageRequest page = 1;
}

// The output of ListWorkspaces.
message ListWorkspacesResponse {
  // The workspaces of the page, oldest first.
  repeated Workspace workspaces = 1;
  // How to get the next page.
  scylla.common.v1.PageResponse page = 2;
}

// The input of UpdateWorkspace. A field that is not set does not change.
message UpdateWorkspaceRequest {
  // The workspace. Required.
  scylla.common.v1.Id workspace_id = 1;
  // The new display name, 1 to 100 characters after trim.
  optional string name = 2;
  // The new slug, trimmed and in lower case.
  optional string slug = 3;
}

// The output of UpdateWorkspace.
message UpdateWorkspaceResponse {
  // The workspace after the change.
  Workspace workspace = 1;
}

// The input of DeleteWorkspace.
message DeleteWorkspaceRequest {
  // The workspace. Required.
  scylla.common.v1.Id workspace_id = 1;
}

// The output of DeleteWorkspace.
message DeleteWorkspaceResponse {}

// The input of AddOwner.
message AddOwnerRequest {
  // The workspace. Required.
  scylla.common.v1.Id workspace_id = 1;
  // The user to make an owner. Required.
  scylla.common.v1.Id user_id = 2;
}

// The output of AddOwner.
message AddOwnerResponse {}

// The input of RemoveOwner.
message RemoveOwnerRequest {
  // The workspace. Required.
  scylla.common.v1.Id workspace_id = 1;
  // The owner to take out. Required.
  scylla.common.v1.Id user_id = 2;
}

// The output of RemoveOwner.
message RemoveOwnerResponse {}

// The input of ListOwners.
message ListOwnersRequest {
  // The workspace. Required.
  scylla.common.v1.Id workspace_id = 1;
  // The page to return.
  scylla.common.v1.PageRequest page = 2;
}

// The output of ListOwners.
message ListOwnersResponse {
  // The owners of the page, in user id order.
  repeated WorkspaceOwner owners = 1;
  // How to get the next page.
  scylla.common.v1.PageResponse page = 2;
}
