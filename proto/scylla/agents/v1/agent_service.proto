syntax = "proto3";

package scylla.agents.v1;

import "scylla/common/v1/id.proto";

// Registers the agents of a user.
service AgentService {
  // Creates an agent with the public key of a key pair that the agent made. The private key never
  // leaves the agent. The caller can act for the new agent.
  rpc RegisterAgent(RegisterAgentRequest) returns (RegisterAgentResponse);
}

// The input of RegisterAgent.
message RegisterAgentRequest {
  // The Ed25519 public key of the agent, 32 bytes.
  bytes public_key = 1;
}

// The output of RegisterAgent.
message RegisterAgentResponse {
  // The new agent.
  scylla.common.v1.Id agent_id = 1;
  // The key, to put in each AgentAssertion.
  scylla.common.v1.Id key_id = 2;
}
