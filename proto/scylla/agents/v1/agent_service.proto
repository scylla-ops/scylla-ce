syntax = "proto3";

package scylla.agents.v1;

import "google/protobuf/timestamp.proto";
import "scylla/apps/v1/app.proto";

// The stream of an agent: an App that runs jobs.
service AgentService {
  // Opens the stream of the calling agent, with its token in "authorization: Bearer <token>".
  // The first message must be a Hello, within 30 seconds. Before its token expires, the agent
  // sends a Renew with a new token from TokenService.ExchangeAppAssertion. At the expiry of the
  // last token, the server closes the stream with UNAUTHENTICATED. A second stream of the same
  // agent closes the first with ABORTED, and so do DeleteApp and RevokeAppKey. An App that is not
  // an agent gets FAILED_PRECONDITION with the reason NOT_A_RUNNER.
  rpc OpenStream(stream OpenStreamRequest) returns (stream OpenStreamResponse);
}

// A message of the agent on its stream.
message OpenStreamRequest {
  // The message.
  oneof message {
    // The first message: the host of the agent.
    Hello hello = 1;
    // A new token for the stream.
    Renew renew = 2;
  }
}

// The first message of a stream: the host of the agent. The server keeps it until the next
// stream.
message Hello {
  // The host.
  scylla.apps.v1.Host host = 1;
}

// A new token of the same agent. The server checks it as at the start of the stream.
message Renew {
  // The token from TokenService.ExchangeAppAssertion.
  string token = 1;
}

// A message of the server on the stream.
message OpenStreamResponse {
  // The message.
  oneof message {
    // The answer to the Hello.
    Welcome welcome = 1;
    // The answer to a Renew.
    Renewed renewed = 2;
  }
}

// The answer to the Hello: the stream is open.
message Welcome {
  // The expiry of the token of the stream. Send a Renew before it.
  google.protobuf.Timestamp expires_at = 1;
}

// The answer to a Renew: the stream uses the new token.
message Renewed {
  // The expiry of the new token.
  google.protobuf.Timestamp expires_at = 1;
}
