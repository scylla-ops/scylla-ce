syntax = "proto3";

package scylla.pipelines.v1;

import "scylla/common/v1/id.proto";
import "scylla/common/v1/page.proto";
import "scylla/pipelines/v1/job.proto";
import "scylla/pipelines/v1/trigger.proto";

// Creates, reads, changes, lists, stops and fires the triggers of a pipeline. Each RPC needs an
// authenticated actor, else UNAUTHENTICATED. An unknown trigger gives PERMISSION_DENIED, as a
// refusal does. A role that manages the triggers also runs the pipeline, so a trigger gives no
// new right.
service TriggerService {
  // Creates a trigger of a pipeline. A webhook trigger gives its secret one time: the server
  // keeps it encrypted, and a server with no key gives FAILED_PRECONDITION with the reason
  // SECRET_KEY_MISSING.
  rpc CreateTrigger(CreateTriggerRequest) returns (CreateTriggerResponse);
  // Reads one trigger. The secret of a webhook is never in it.
  rpc GetTrigger(GetTriggerRequest) returns (GetTriggerResponse);
  // Changes the name, the schedule of a cron trigger, or the inputs. The kind does not change.
  rpc UpdateTrigger(UpdateTriggerRequest) returns (UpdateTriggerResponse);
  // Deletes a trigger. Its jobs stay.
  rpc DeleteTrigger(DeleteTriggerRequest) returns (DeleteTriggerResponse);
  // Lists the triggers of a pipeline, oldest first.
  rpc ListPipelineTriggers(ListPipelineTriggersRequest) returns (ListPipelineTriggersResponse);
  // Starts or stops a trigger. A schedule that starts again fires at its next time after now.
  rpc SetTriggerEnabled(SetTriggerEnabledRequest) returns (SetTriggerEnabledResponse);
  // Fires a trigger now, with no body: a JSON pointer gives an empty text.
  rpc FireTriggerNow(FireTriggerNowRequest) returns (FireTriggerNowResponse);
}

// The input of CreateTrigger.
message CreateTriggerRequest {
  // The pipeline. Required.
  scylla.common.v1.Id pipeline_id = 1;
  // The display name, 1 to 100 characters after trim, unique in the pipeline.
  string name = 2;
  // What starts the jobs. Required. The path of a webhook is not read.
  oneof kind {
    // A schedule.
    Cron cron = 3;
    // A webhook.
    Webhook webhook = 4;
  }
  // The inputs, at most 128 with unique names. A JSON pointer only for a webhook.
  repeated TriggerInput inputs = 5;
}

// The output of CreateTrigger.
message CreateTriggerResponse {
  // The new trigger.
  Trigger trigger = 1;
  // The secret of a webhook in hex, one time: the server keeps it encrypted. Empty for a cron
  // trigger.
  string webhook_secret = 2;
}

// The input of GetTrigger.
message GetTriggerRequest {
  // The trigger. Required.
  scylla.common.v1.Id trigger_id = 1;
}

// The output of GetTrigger.
message GetTriggerResponse {
  // The trigger.
  Trigger trigger = 1;
}

// The input of UpdateTrigger. A field that is not set does not change.
message UpdateTriggerRequest {
  // The trigger. Required.
  scylla.common.v1.Id trigger_id = 1;
  // The new display name.
  optional string name = 2;
  // The new schedule of a cron trigger.
  optional string schedule = 3;
  // The new inputs. They replace all the inputs.
  TriggerInputList inputs = 4;
}

// A list of inputs, so a request can tell "no change" from "these inputs".
message TriggerInputList {
  // The inputs.
  repeated TriggerInput inputs = 1;
}

// The output of UpdateTrigger.
message UpdateTriggerResponse {
  // The changed trigger.
  Trigger trigger = 1;
}

// The input of DeleteTrigger.
message DeleteTriggerRequest {
  // The trigger. Required.
  scylla.common.v1.Id trigger_id = 1;
}

// The output of DeleteTrigger.
message DeleteTriggerResponse {}

// The input of ListPipelineTriggers.
message ListPipelineTriggersRequest {
  // The pipeline. Required.
  scylla.common.v1.Id pipeline_id = 1;
  // The page to return.
  scylla.common.v1.PageRequest page = 2;
}

// The output of ListPipelineTriggers.
message ListPipelineTriggersResponse {
  // The triggers of the page, oldest first.
  repeated Trigger triggers = 1;
  // How to get the next page.
  scylla.common.v1.PageResponse page = 2;
}

// The input of SetTriggerEnabled.
message SetTriggerEnabledRequest {
  // The trigger. Required.
  scylla.common.v1.Id trigger_id = 1;
  // True starts the trigger, false stops it.
  bool enabled = 2;
}

// The output of SetTriggerEnabled.
message SetTriggerEnabledResponse {
  // The trigger.
  Trigger trigger = 1;
}

// The input of FireTriggerNow.
message FireTriggerNowRequest {
  // The trigger. Required.
  scylla.common.v1.Id trigger_id = 1;
}

// The output of FireTriggerNow.
message FireTriggerNowResponse {
  // The new pending job.
  Job job = 1;
}
