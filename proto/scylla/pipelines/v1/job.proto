syntax = "proto3";

package scylla.pipelines.v1;

import "google/protobuf/timestamp.proto";
import "scylla/common/v1/id.proto";
import "scylla/pipelines/v1/pipeline.proto";

// A job: one run of a pipeline on an agent.
message Job {
  // The id of the job.
  scylla.common.v1.Id id = 1;
  // The pipeline.
  scylla.common.v1.Id pipeline_id = 2;
  // The project of the pipeline.
  scylla.common.v1.Id project_id = 3;
  // The workspace of the project.
  scylla.common.v1.Id workspace_id = 4;
  // The actor that started the job.
  scylla.common.v1.Id created_by = 5;
  // The job that this job runs again. Not set for a first run.
  scylla.common.v1.Id rerun_of = 6;
  // The state of the job.
  JobStatus status = 7;
  // The nodes of the pipeline at the start of the job. A later change of the pipeline does not
  // change them.
  repeated Node nodes = 8;
  // The state of each node, in the order of the nodes.
  repeated NodeRun runs = 9;
  // The agent of the job, once the server placed it.
  scylla.common.v1.Id agent_id = 10;
  // The error of a failed job. Empty for another job.
  string error = 11;
  // The creation time.
  google.protobuf.Timestamp created_at = 12;
  // The start on the agent.
  google.protobuf.Timestamp started_at = 13;
  // The end.
  google.protobuf.Timestamp finished_at = 14;
}

// The state of a job.
enum JobStatus {
  // Not used.
  JOB_STATUS_UNSPECIFIED = 0;
  // The job waits for an agent, or for the start of its agent.
  JOB_STATUS_PENDING = 1;
  // The agent runs the job.
  JOB_STATUS_RUNNING = 2;
  // Each node completed or was skipped.
  JOB_STATUS_COMPLETED = 3;
  // A node failed, or the dispatch failed. The error tells why.
  JOB_STATUS_FAILED = 4;
  // A person cancelled the job.
  JOB_STATUS_CANCELLED = 5;
  // The agent of the running job went away.
  JOB_STATUS_ORPHANED = 6;
}

// The state of one node in a job.
message NodeRun {
  // The node.
  string node_id = 1;
  // The state.
  NodeStatus status = 2;
  // The current attempt, from 1. 0 before the start.
  uint32 attempt = 3;
  // The start of the first attempt.
  google.protobuf.Timestamp started_at = 4;
  // The end.
  google.protobuf.Timestamp finished_at = 5;
  // The exit code of the last attempt, if the process ended.
  optional int32 exit_code = 6;
  // The error of a failed node. Empty for another node.
  string error = 7;
}

// The state of a node in a job.
enum NodeStatus {
  // Not used.
  NODE_STATUS_UNSPECIFIED = 0;
  // The node waits for its needs.
  NODE_STATUS_PENDING = 1;
  // The node runs.
  NODE_STATUS_RUNNING = 2;
  // The node completed.
  NODE_STATUS_COMPLETED = 3;
  // The node failed after its last attempt.
  NODE_STATUS_FAILED = 4;
  // The node did not run, because a node failed.
  NODE_STATUS_SKIPPED = 5;
  // The job ended before the node ended.
  NODE_STATUS_CANCELLED = 6;
}

// A line of the output of a node.
message LogLine {
  // The output of the line.
  LogStream stream = 1;
  // The text, at most 64 KiB, with no line break at its end.
  string text = 2;
  // The time when the agent read the line.
  google.protobuf.Timestamp at = 3;
}

// The output of a line.
enum LogStream {
  // Not used.
  LOG_STREAM_UNSPECIFIED = 0;
  // The standard output.
  LOG_STREAM_STDOUT = 1;
  // The standard error.
  LOG_STREAM_STDERR = 2;
}
