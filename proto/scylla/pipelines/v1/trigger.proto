syntax = "proto3";

package scylla.pipelines.v1;

import "google/protobuf/timestamp.proto";
import "scylla/common/v1/id.proto";

// A trigger of a pipeline: a cron schedule or a webhook that starts a job. The jobs of the
// triggers of a workspace have the runner of the triggers of the workspace as their author.
message Trigger {
  // The id of the trigger.
  scylla.common.v1.Id id = 1;
  // The pipeline.
  scylla.common.v1.Id pipeline_id = 2;
  // The project of the pipeline.
  scylla.common.v1.Id project_id = 3;
  // The workspace of the project.
  scylla.common.v1.Id workspace_id = 4;
  // The actor that created the trigger.
  scylla.common.v1.Id created_by = 5;
  // The display name, unique in the pipeline.
  string name = 6;
  // What starts the jobs.
  oneof kind {
    // A schedule.
    Cron cron = 7;
    // A webhook.
    Webhook webhook = 8;
  }
  // The inputs: each node of a job gets them in its environment. A variable of the node with the
  // same name wins.
  repeated TriggerInput inputs = 9;
  // False stops the trigger: its schedule does not fire, and its webhook gives 404.
  bool enabled = 10;
  // The next fire of a schedule.
  google.protobuf.Timestamp next_fire_at = 11;
  // The last fire.
  google.protobuf.Timestamp last_fired_at = 12;
  // The result of the last fire.
  FireStatus last_status = 13;
  // The reason of a last fire that failed.
  string last_error = 14;
  // The creation time.
  google.protobuf.Timestamp created_at = 15;
  // The time of the last change.
  google.protobuf.Timestamp updated_at = 16;
}

// A schedule of 5 cron fields (minute, hour, day of the month, month, day of the week), in UTC.
message Cron {
  // The schedule, for example "0 3 * * 1-5".
  string schedule = 1;
}

// A webhook. A request goes to POST /webhooks/{id} on the API URL, with the HMAC-SHA256 of the
// body in the header X-Scylla-Signature-256 or X-Hub-Signature-256, with or without the prefix
// sha256=. A key in X-Scylla-Delivery or X-GitHub-Delivery stops a second fire of one delivery.
message Webhook {
  // The path of the route of the trigger.
  string path = 1;
}

// An input of a trigger.
message TriggerInput {
  // The name of the variable.
  string name = 1;
  // The value. Required.
  oneof value {
    // A text.
    string literal = 2;
    // A JSON pointer into the body of a webhook, for example /after. A missing value gives 422.
    // A fire with no body gives an empty text.
    string json_pointer = 3;
  }
}

// The result of the last fire of a trigger.
enum FireStatus {
  // No fire yet.
  FIRE_STATUS_UNSPECIFIED = 0;
  // The fire made a job.
  FIRE_STATUS_OK = 1;
  // The fire failed. last_error tells why.
  FIRE_STATUS_ERROR = 2;
}
