syntax = "proto3";

package scylla.pipelines.v1;

import "scylla/common/v1/id.proto";
import "scylla/common/v1/page.proto";
import "scylla/pipelines/v1/job.proto";

// Reads, stops, deletes, runs again and lists the jobs, and follows their logs. Each RPC needs an
// authenticated actor, else UNAUTHENTICATED. An unknown job gives PERMISSION_DENIED, as a
// refusal does.
service JobService {
  // Reads one job, with the state of each node.
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  // Cancels a pending or running job. Its agent stops it. A job that ended does not change.
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);
  // Deletes a job with its logs. The agent stops a running job.
  rpc DeleteJob(DeleteJobRequest) returns (DeleteJobResponse);
  // Starts a new pending job with the nodes and the pipeline of a job that ended. The secrets
  // resolve again. A job that did not end gives FAILED_PRECONDITION with the reason
  // JOB_NOT_ENDED.
  rpc RerunJob(RerunJobRequest) returns (RerunJobResponse);
  // Lists the jobs of a pipeline, newest first.
  rpc ListPipelineJobs(ListPipelineJobsRequest) returns (ListPipelineJobsResponse);
  // Lists the jobs of a workspace, newest first: the readers of the workspace.
  rpc ListWorkspaceJobs(ListWorkspaceJobsRequest) returns (ListWorkspaceJobsResponse);
  // Sends the logs of a job after a cursor, then the new logs while the job runs. The stream
  // ends after the last logs of a job that ended.
  rpc TailJobLogs(TailJobLogsRequest) returns (stream TailJobLogsResponse);
}

// The input of GetJob.
message GetJobRequest {
  // The job. Required.
  scylla.common.v1.Id job_id = 1;
}

// The output of GetJob.
message GetJobResponse {
  // The job.
  Job job = 1;
}

// The input of CancelJob.
message CancelJobRequest {
  // The job. Required.
  scylla.common.v1.Id job_id = 1;
}

// The output of CancelJob.
message CancelJobResponse {
  // The job after the cancel.
  Job job = 1;
}

// The input of DeleteJob.
message DeleteJobRequest {
  // The job. Required.
  scylla.common.v1.Id job_id = 1;
}

// The output of DeleteJob.
message DeleteJobResponse {}

// The input of RerunJob.
message RerunJobRequest {
  // The job that ended. Required.
  scylla.common.v1.Id job_id = 1;
}

// The output of RerunJob.
message RerunJobResponse {
  // The new pending job.
  Job job = 1;
}

// The input of ListPipelineJobs.
message ListPipelineJobsRequest {
  // The pipeline. Required.
  scylla.common.v1.Id pipeline_id = 1;
  // The page to return.
  scylla.common.v1.PageRequest page = 2;
}

// The output of ListPipelineJobs.
message ListPipelineJobsResponse {
  // The jobs of the page, newest first.
  repeated Job jobs = 1;
  // How to get the next page.
  scylla.common.v1.PageResponse page = 2;
}

// The input of ListWorkspaceJobs.
message ListWorkspaceJobsRequest {
  // The workspace. Required.
  scylla.common.v1.Id workspace_id = 1;
  // Only the jobs of this agent. Not set gives all the jobs.
  scylla.common.v1.Id agent_id = 2;
  // The page to return.
  scylla.common.v1.PageRequest page = 3;
}

// The output of ListWorkspaceJobs.
message ListWorkspaceJobsResponse {
  // The jobs of the page, newest first.
  repeated Job jobs = 1;
  // How to get the next page.
  scylla.common.v1.PageResponse page = 2;
}

// The input of TailJobLogs.
message TailJobLogsRequest {
  // The job. Required.
  scylla.common.v1.Id job_id = 1;
  // Only the logs of this node. Empty gives the logs of each node.
  string node_id = 2;
  // The cursor of the last message that the client got. Empty starts at the first logs.
  string after = 3;
}

// One batch of lines of one node.
message TailJobLogsResponse {
  // The cursor of this batch, to give as after when the client follows the logs again.
  string cursor = 1;
  // The node of the lines.
  string node_id = 2;
  // The lines, in order.
  repeated LogLine lines = 3;
}
