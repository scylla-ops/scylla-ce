syntax = "proto3";

package scylla.access.v1;

import "scylla/common/v1/id.proto";
import "scylla/common/v1/page.proto";

// Gives, takes back and lists the roles of actors on objects, and tells the caller its
// permissions. The owners of the workspace of an object need no role. Each RPC needs an
// authenticated actor, else UNAUTHENTICATED.
service AccessService {
  // Gives a role on an object to an actor. The caller needs the permission grant on the
  // object. An unknown object gives PERMISSION_DENIED, as a refusal does. An agent gets a role
  // only in its own workspace: an object of another workspace gives FAILED_PRECONDITION with
  // the reason ACTOR_OUTSIDE_WORKSPACE.
  rpc Grant(GrantRequest) returns (GrantResponse);
  // Takes back a role on an object from an actor. The caller needs the permission revoke on
  // the object.
  rpc Revoke(RevokeRequest) returns (RevokeResponse);
  // Lists the access to an object: for a workspace, its owners first, then the roles on the
  // object. The caller needs the permission list_access: the readers of a workspace, the
  // viewers of a project. An unknown object gives PERMISSION_DENIED, as a refusal does.
  rpc ListAccess(ListAccessRequest) returns (ListAccessResponse);
  // Tells, for each permission of the request, if the caller has it on an object, as a route
  // check finds it. Each caller can ask for itself. An unknown object gives false for each
  // permission. A name that is not a permission of the definition of the object gives
  // INVALID_ARGUMENT.
  rpc CheckPermissions(CheckPermissionsRequest) returns (CheckPermissionsResponse);
}

// An object of the permission model.
message ObjectRef {
  // The kind of the object: the name of its definition, for example workspace, project or
  // platform.
  string kind = 1;
  // The id of the object.
  scylla.common.v1.Id id = 2;
}

// The input of Grant.
message GrantRequest {
  // The object of the role. Required.
  ObjectRef object = 1;
  // The role: a relation of the definition, for example viewer on a project.
  string role = 2;
  // The actor that gets the role. Required. The actor must exist.
  scylla.common.v1.Id actor_id = 3;
}

// The output of Grant. It is empty, so a later field does not change the RPC.
message GrantResponse {}

// The input of Revoke.
message RevokeRequest {
  // The object of the role. Required.
  ObjectRef object = 1;
  // The role to take back.
  string role = 2;
  // The actor that loses the role. Required.
  scylla.common.v1.Id actor_id = 3;
}

// The output of Revoke. It is empty, so a later field does not change the RPC.
message RevokeResponse {}

// The input of ListAccess.
message ListAccessRequest {
  // The object: a workspace, a project, or another kind with roles. Required.
  ObjectRef object = 1;
  // The page to return.
  scylla.common.v1.PageRequest page = 2;
}

// One access to an object: an owner of the workspace, or an actor with a role.
message AccessEntry {
  // The actor.
  scylla.common.v1.Id actor_id = 1;
  // The kind of the actor, for example user or agent.
  string actor_kind = 2;
  // The display name of a user. Empty for the other kinds.
  string display_name = 3;
  // The handle of a user. Empty if the user has none.
  string handle = 4;
  // The role, for example admin or viewer, or owner for an owner of the workspace.
  string role = 5;
}

// The output of ListAccess.
message ListAccessResponse {
  // The entries of the page: the owners first, in user id order, then the roles.
  repeated AccessEntry entries = 1;
  // How to get the next page.
  scylla.common.v1.PageResponse page = 2;
}

// The input of CheckPermissions.
message CheckPermissionsRequest {
  // The object: a workspace, a project, the platform, or another kind with roles. Required.
  ObjectRef object = 1;
  // The names of the permissions, for example get_workspace or delete_project. At most 50.
  repeated string permissions = 2;
}

// The answer for one permission.
message PermissionAnswer {
  // The name of the permission.
  string permission = 1;
  // True if the caller has the permission on the object.
  bool allowed = 2;
}

// The output of CheckPermissions.
message CheckPermissionsResponse {
  // One answer for each permission of the request, in the order of the request.
  repeated PermissionAnswer answers = 1;
}
