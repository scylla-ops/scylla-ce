syntax = "proto3";

package scylla.projects.v1;

import "google/protobuf/timestamp.proto";
import "scylla/common/v1/id.proto";

// A secret of a project: its metadata. No message holds the value of a secret: only the run of
// a pipeline that names it gets it.
message Secret {
  // The id of the secret.
  scylla.common.v1.Id id = 1;
  // The project of the secret.
  scylla.common.v1.Id project_id = 2;
  // The name, 1 to 128 ASCII letters, digits, dots, dashes or underscores, unique in the
  // project. A pipeline names a secret by its name.
  string name = 3;
  // The actor that created the secret.
  scylla.common.v1.Id created_by = 4;
  // The creation time. The server sets it.
  google.protobuf.Timestamp created_at = 5;
  // The time of the last change of the value. It is created_at until UpdateSecret changes the
  // value.
  google.protobuf.Timestamp updated_at = 6;
}
