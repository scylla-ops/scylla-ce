syntax = "proto3";

package scylla.projects.v1;

import "scylla/common/v1/id.proto";
import "scylla/common/v1/page.proto";
import "scylla/projects/v1/project.proto";

// Creates, reads, changes, lists and deletes projects. Each RPC needs an authenticated actor,
// else UNAUTHENTICATED.
service ProjectService {
  // Creates a project. An edition can refuse it with FAILED_PRECONDITION and a
  // google.rpc.ErrorInfo detail.
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  // Reads one project. An unknown project gives PERMISSION_DENIED, as a refusal does.
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  // Lists the projects that the caller can see, oldest first: the projects of the workspaces
  // that it owns or where it has a role, and the projects shared with it.
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  // Changes the name or the description of a project. The caller needs the permission
  // update_project: the owners, the admins and the members of its workspace, and the admins
  // and the editors of the project. The last change wins. An unknown project gives
  // PERMISSION_DENIED, as a refusal does.
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse);
  // Deletes a project with its secrets.
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);
}

// The input of CreateProject.
message CreateProjectRequest {
  // The workspace of the new project. Required.
  scylla.common.v1.Id workspace_id = 1;
  // The display name, 1 to 100 characters after trim, on one line.
  string name = 2;
  // The description, at most 1024 characters after trim. Empty means no description.
  string description = 3;
}

// The output of CreateProject.
message CreateProjectResponse {
  // The created project.
  Project project = 1;
}

// The input of GetProject.
message GetProjectRequest {
  // The project to read. Required.
  scylla.common.v1.Id project_id = 1;
}

// The output of GetProject.
message GetProjectResponse {
  // The project.
  Project project = 1;
}

// The input of ListProjects.
message ListProjectsRequest {
  // Only the projects of this workspace that the caller can see. Not set means all the
  // projects that the caller can see.
  scylla.common.v1.Id workspace_id = 1;
  // The page to return.
  scylla.common.v1.PageRequest page = 2;
}

// The output of ListProjects.
message ListProjectsResponse {
  // The projects of the page, oldest first.
  repeated Project projects = 1;
  // How to get the next page.
  scylla.common.v1.PageResponse page = 2;
}

// The input of UpdateProject. A field that is not set does not change.
message UpdateProjectRequest {
  // The project. Required.
  scylla.common.v1.Id project_id = 1;
  // The new display name, 1 to 100 characters after trim, on one line.
  optional string name = 2;
  // The new description, at most 1024 characters after trim. An empty text removes the
  // description.
  optional string description = 3;
}

// The output of UpdateProject.
message UpdateProjectResponse {
  // The project after the change.
  Project project = 1;
}

// The input of DeleteProject.
message DeleteProjectRequest {
  // The project to delete. Required.
  scylla.common.v1.Id project_id = 1;
}

// The output of DeleteProject. It is empty, so a later field does not change the RPC.
message DeleteProjectResponse {}
