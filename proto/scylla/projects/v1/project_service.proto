syntax = "proto3";

package scylla.projects.v1;

import "scylla/common/v1/id.proto";
import "scylla/common/v1/page.proto";
import "scylla/projects/v1/project.proto";

// Creates, lists and deletes projects. Each RPC needs an authenticated actor, else UNAUTHENTICATED.
service ProjectService {
  // Creates a project. An edition can refuse it with FAILED_PRECONDITION and a
  // google.rpc.ErrorInfo detail.
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  // Lists the projects of one owner, oldest first.
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  // Deletes a project.
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);
}

// The input of CreateProject.
message CreateProjectRequest {
  // The actor that will own the project. Not set means the caller. The actor must exist.
  scylla.common.v1.Id owner_id = 1;
  // The display name, 1 to 100 characters after trim.
  string name = 2;
}

// The output of CreateProject.
message CreateProjectResponse {
  // The created project.
  Project project = 1;
}

// The input of ListProjects.
message ListProjectsRequest {
  // The owner of the projects. Not set means the caller.
  scylla.common.v1.Id owner_id = 1;
  // The page to return.
  scylla.common.v1.PageRequest page = 2;
}

// The output of ListProjects.
message ListProjectsResponse {
  // The projects of the page, oldest first.
  repeated Project projects = 1;
  // How to get the next page.
  scylla.common.v1.PageResponse page = 2;
}

// The input of DeleteProject.
message DeleteProjectRequest {
  // The project to delete. Required.
  scylla.common.v1.Id project_id = 1;
}

// The output of DeleteProject. It is empty, so a later field does not change the RPC.
message DeleteProjectResponse {}
