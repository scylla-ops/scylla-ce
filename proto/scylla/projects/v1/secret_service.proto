syntax = "proto3";

package scylla.projects.v1;

import "scylla/common/v1/id.proto";
import "scylla/common/v1/page.proto";
import "scylla/projects/v1/secret.proto";

// Creates, changes, deletes and lists the secrets of a project. The server encrypts each value
// and no RPC returns a value. Each RPC needs an authenticated actor, else UNAUTHENTICATED. An
// unknown project or secret gives PERMISSION_DENIED, as a refusal does.
service SecretService {
  // Creates a secret in a project. The caller needs the permission create_secret: the owners
  // and the admins of the workspace, and the admins of the project. A name in use in the
  // project gives FAILED_PRECONDITION with the reason SECRET_NAME_IN_USE. A server with no
  // key for the secrets gives FAILED_PRECONDITION with the reason SECRET_KEY_MISSING.
  rpc CreateSecret(CreateSecretRequest) returns (CreateSecretResponse);
  // Gives a secret a new value. The name does not change. The caller needs the permission
  // update_secret: the owners and the admins of the workspace, and the admins of the project.
  // The last change wins. A server with no key for the secrets gives FAILED_PRECONDITION with
  // the reason SECRET_KEY_MISSING.
  rpc UpdateSecret(UpdateSecretRequest) returns (UpdateSecretResponse);
  // Deletes a secret, also when a pipeline names it: the next run of that pipeline fails. The
  // caller needs the permission delete_secret: the owners and the admins of the workspace, and
  // the admins of the project.
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
  // Lists the secrets of a project in name order, with no value. The caller needs the
  // permission list_secrets: the owners, the admins and the members of the workspace, and the
  // admins and the editors of the project.
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
}

// The input of CreateSecret.
message CreateSecretRequest {
  // The project of the new secret. Required.
  scylla.common.v1.Id project_id = 1;
  // The name, trimmed: 1 to 128 ASCII letters, digits, dots, dashes or underscores, unique in
  // the project.
  string name = 2;
  // The value, at most 65536 bytes, kept as it is. The server encrypts it.
  string value = 3;
}

// The output of CreateSecret.
message CreateSecretResponse {
  // The created secret, with no value.
  Secret secret = 1;
}

// The input of UpdateSecret.
message UpdateSecretRequest {
  // The secret. Required.
  scylla.common.v1.Id secret_id = 1;
  // The new value, at most 65536 bytes, kept as it is. The old value is lost.
  string value = 2;
}

// The output of UpdateSecret.
message UpdateSecretResponse {
  // The secret after the change, with no value.
  Secret secret = 1;
}

// The input of DeleteSecret.
message DeleteSecretRequest {
  // The secret. Required.
  scylla.common.v1.Id secret_id = 1;
}

// The output of DeleteSecret. It is empty, so a later field does not change the RPC.
message DeleteSecretResponse {}

// The input of ListSecrets.
message ListSecretsRequest {
  // The project. Required.
  scylla.common.v1.Id project_id = 1;
  // The page to return.
  scylla.common.v1.PageRequest page = 2;
}

// The output of ListSecrets.
message ListSecretsResponse {
  // The secrets of the page, in name order (byte order: upper case before lower case), with
  // no value.
  repeated Secret secrets = 1;
  // How to get the next page.
  scylla.common.v1.PageResponse page = 2;
}
