syntax = "proto3";

package scylla.capabilities.v1;

// Tells a client which edition runs and which optional features it has.
service CapabilityService {
  // Returns the edition and its optional features.
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
}

// The input of GetCapabilities. It is empty.
message GetCapabilitiesRequest {}

// The output of GetCapabilities.
message GetCapabilitiesResponse {
  // The edition name, as the server reports it.
  string edition = 1;
  // The optional features of this edition. The core features are always present and are not
  // in the list.
  repeated string capabilities = 2;
}
