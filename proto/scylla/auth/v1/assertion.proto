syntax = "proto3";

package scylla.auth.v1;

import "google/protobuf/timestamp.proto";
import "scylla/common/v1/id.proto";

// What an agent signs with its private key to get a token. The agent sends the encoded bytes of
// this message and an Ed25519 signature of these bytes.
message AgentAssertion {
  // The agent.
  scylla.common.v1.Id agent_id = 1;
  // The key of the agent that signs, from RegisterAgent.
  scylla.common.v1.Id key_id = 2;
  // Must be "scylla".
  string audience = 3;
  // At most 2 minutes after now. The server refuses an expired assertion.
  google.protobuf.Timestamp expires_at = 4;
  // A random value, at least 16 characters. The server refuses a nonce that it saw before.
  string nonce = 5;
}
