# At each tag v*: builds the agent for each platform, publishes the archives and SHA256SUMS in
# the release of the tag, and pushes the image ghcr.io/scylla-ops/scylla-agent. A tag with a `-`
# is a pre-release, and it does not change `latest`.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: the tag is the version of the workspace
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "tag $GITHUB_REF_NAME, version $version"
          test "$GITHUB_REF_NAME" = "v$version"

  agent:
    name: agent ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, zig: true, native: true }
          - { os: ubuntu-24.04, target: aarch64-unknown-linux-musl, zig: true, native: false }
          - { os: macos-15, target: aarch64-apple-darwin, zig: false, native: true }
          - { os: macos-15, target: x86_64-apple-darwin, zig: false, native: false }
          - { os: windows-2025, target: x86_64-pc-windows-msvc, zig: false, native: true }
          - { os: windows-2025, target: aarch64-pc-windows-msvc, zig: false, native: false }
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - if: matrix.zig
        run: pip install cargo-zigbuild
      - name: build
        shell: bash
        run: |
          build=build
          if [ "${{ matrix.zig }}" = true ]; then build=zigbuild; fi
          cargo "$build" --release --locked -p scylla-agent --target ${{ matrix.target }}
      - name: the binary starts and has the version
        if: matrix.native
        shell: bash
        run: |
          test "$("target/${{ matrix.target }}/release/scylla-agent" --version)" = "scylla-agent ${GITHUB_REF_NAME#v}"
      - name: package
        shell: bash
        run: |
          mkdir dist
          cd "target/${{ matrix.target }}/release"
          case "${{ matrix.target }}" in
            *windows*) 7z a "$GITHUB_WORKSPACE/dist/scylla-agent-${{ matrix.target }}.zip" scylla-agent.exe ;;
            *) tar czf "$GITHUB_WORKSPACE/dist/scylla-agent-${{ matrix.target }}.tar.gz" scylla-agent ;;
          esac
      - uses: actions/upload-artifact@v5
        with:
          name: agent-${{ matrix.target }}
          path: dist/*

  release:
    needs: agent
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: agent-*
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum scylla-agent-* > SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/scylla-agent-*
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            exit 0
          fi
          case "$GITHUB_REF_NAME" in
            *-*) kind=--prerelease ;;
            *) kind=--latest ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes "$kind"

  image:
    needs: agent
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: agent-*-linux-musl
          path: artifacts
          merge-multiple: true
      - name: binaries
        run: |
          mkdir -p dist/linux-amd64 dist/linux-arm64
          tar xzf artifacts/scylla-agent-x86_64-unknown-linux-musl.tar.gz -C dist/linux-amd64
          tar xzf artifacts/scylla-agent-aarch64-unknown-linux-musl.tar.gz -C dist/linux-arm64
      - name: tags
        id: tags
        run: |
          image=ghcr.io/scylla-ops/scylla-agent
          version=${GITHUB_REF_NAME#v}
          {
            echo 'list<<EOF'
            echo "${image}:${version}"
            case "$version" in
              *-*) ;;
              *)
                echo "${image}:${version%.*}"
                echo "${image}:latest"
                ;;
            esac
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/agent.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: sigstore/cosign-installer@v4.1.3
      - name: signature
        run: cosign sign --yes "ghcr.io/scylla-ops/scylla-agent@${{ steps.build.outputs.digest }}"
