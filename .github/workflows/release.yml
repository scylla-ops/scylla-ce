# At each tag v*: builds the agent for each platform, publishes the archives and SHA256SUMS in
# the release of the tag, and pushes the image ghcr.io/scylla-ops/scylla-agent.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  agent:
    name: agent ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, zig: true }
          - { os: ubuntu-24.04, target: aarch64-unknown-linux-musl, zig: true }
          - { os: macos-15, target: aarch64-apple-darwin, zig: false }
          - { os: macos-15, target: x86_64-apple-darwin, zig: false }
          - { os: windows-2025, target: x86_64-pc-windows-msvc, zig: false }
          - { os: windows-2025, target: aarch64-pc-windows-msvc, zig: false }
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - if: matrix.zig
        run: pip install cargo-zigbuild
      - name: build
        shell: bash
        run: |
          build=build
          if [ "${{ matrix.zig }}" = true ]; then build=zigbuild; fi
          cargo "$build" --release --locked -p scylla-agent --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          mkdir dist
          cd "target/${{ matrix.target }}/release"
          case "${{ matrix.target }}" in
            *windows*) 7z a "$GITHUB_WORKSPACE/dist/scylla-agent-${{ matrix.target }}.zip" scylla-agent.exe ;;
            *) tar czf "$GITHUB_WORKSPACE/dist/scylla-agent-${{ matrix.target }}.tar.gz" scylla-agent ;;
          esac
      - uses: actions/upload-artifact@v5
        with:
          name: agent-${{ matrix.target }}
          path: dist/*

  release:
    needs: agent
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: agent-*
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum scylla-agent-* > SHA256SUMS
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  image:
    needs: agent
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: agent-*-linux-musl
          path: artifacts
          merge-multiple: true
      - name: binaries
        run: |
          mkdir -p dist/linux-amd64 dist/linux-arm64
          tar xzf artifacts/scylla-agent-x86_64-unknown-linux-musl.tar.gz -C dist/linux-amd64
          tar xzf artifacts/scylla-agent-aarch64-unknown-linux-musl.tar.gz -C dist/linux-arm64
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/agent.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/scylla-ops/scylla-agent:${{ env.VERSION }}
            ghcr.io/scylla-ops/scylla-agent:latest
