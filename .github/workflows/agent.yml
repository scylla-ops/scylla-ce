# At each change of the agent: its lint and its unit tests on macOS and Windows. The Linux checks
# (lint, unit tests, tests against the real server) run in Scylla: .scylla/pipelines/ci.yaml.
name: agent

on:
  push:
    branches: [main, v0.7.1]
    paths:
      - scylla-agent/**
      - scylla-core/src/features/identity/agents/**
      - Cargo.lock
      - .github/workflows/agent.yml
  pull_request:
    paths:
      - scylla-agent/**
      - scylla-core/src/features/identity/agents/**
      - .github/workflows/agent.yml

permissions:
  contents: read

env:
  SQLX_OFFLINE: "true"

jobs:
  lint:
    name: lint and unit tests ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked -p scylla-agent --all-targets -- -D warnings
      - run: cargo test --locked -p scylla-agent --lib --bins

