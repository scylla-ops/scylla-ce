[workspace]
resolver = "3"
members = [
    "crates/scylla-extension",
    "crates/scylla-domain",
    "crates/scylla-proto",
    "crates/scylla-auth",
    "crates/scylla-core",
    "crates/scylla-db",
    "crates/scylla-server",
    "binaries/scylla-ce",
    "binaries/scylla-agent",
]

# Shared package metadata: every member inherits it with `field.workspace = true`.
[workspace.package]
license = "Apache-2.0"
repository = "https://github.com/scylla-ops/scylla"

[workspace.dependencies]
# async
tokio = { version = "1.5", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1.89"
futures-core = "0.3"
futures-util = "0.3"

# grpc / proto
tonic = { version = "0.14", features = ["server"] }
# `default-features = false` matters: tokio-rustls defaults to the aws-lc-rs
# provider, which is not in Cargo.lock and needs a C/NASM toolchain — it would
# break the linux/arm64 leg of a buildx release. `ring` is what the rest of the
# graph already resolves to.
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "logging",
    "tls12",
] }
tonic-web = "0.14"
tonic-prost = "0.14"
tonic-reflection = "0.14"
prost = "0.14"
prost-types = "0.14"
tonic-prost-build = "0.14"
scylla-proto = { path = "crates/scylla-proto" }
tonic-async-interceptor = "0.14"

# serialization
serde = { version = "1", features = ["derive"] }
humantime-serde = "1"
toml = "1"

# database
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
    "chrono",
    "json",
] }

# workspace crates
scylla-extension = { path = "crates/scylla-extension" }
scylla-domain = { path = "crates/scylla-domain" }
scylla-auth = { path = "crates/scylla-auth" }
scylla-core = { path = "crates/scylla-core" }
scylla-db = { path = "crates/scylla-db" }
scylla-server = { path = "crates/scylla-server" }

# domain / utilities
thiserror = "2.0.18"
anyhow = "1.0.102"
chrono = "0.4"
# 5-field Vixie cron parsing + next-occurrence computation (UTC), chrono-native.
# Lives behind the CronSchedule application port; the domain stays library-free.
croner = "4"
ulid = "3"
uuid = { version = "1", features = ["v4"] }
derive_more = { version = "2.1.1", features = ["full"] }
derive-where = "1.6"
nutype = { version = "0.7", features = ["serde"] }
bon = "3.9"
argon2 = "0.6"
# Reversible AEAD for project secrets (decrypted at dispatch). XChaCha20-Poly1305
# = 24-byte random nonce, so encrypting many secrets under one key is safe.
# (0.11 dropped the `std` feature; default alloc + getrandom is all we use.)
chacha20poly1305 = "0.11"
# Webhook HMAC-SHA256 signature verification (constant-time compare via Mac::verify_slice).
# hmac 0.13 + sha2 0.11 share digest 0.11.
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
# Reset link tokens: 32 bytes from the OS, in base64url without padding.
getrandom = "0.4"
base64 = "0.22"
cedar-policy = "4"

# web / tracing
# `http2` is NOT an axum default feature. We serve through tonic's transport, so
# axum's own h2 support is not load-bearing today — but leaving it implicit made
# HTTP/2 an emergent property of tonic's feature set, which is not something to
# rely on for the agents' native gRPC.
axum = { version = "0.8", features = ["http2"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = [
    "cors",
    "trace",
    # UI serving: `fs` for the [ui].dir override, the rest to replace what Caddy
    # used to do (`encode zstd gzip`, the immutable Cache-Control on /assets/*).
    "fs",
    "set-header",
    "compression-gzip",
    "compression-br",
] }
http = "1.4"
serde_json = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }


# web UI: the Vite build is compiled into the control-plane binary
rust-embed = { version = "8", features = ["mime-guess"] }

# cli
clap = { version = "4", features = ["derive", "env"] }

# logging
log = "0.4"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# doc-related: re-enable once we doc-pass the crates
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
# naming / repetition: too noisy in this layered codebase
module_name_repetitions = "allow"
struct_field_names = "allow"
similar_names = "allow"
# preference / style: not load-bearing
uninlined_format_args = "allow"
must_use_candidate = "allow"
# false-positive heavy in test stubs (Box<dyn Fn(...)> mocks)
type_complexity = "allow"
field_reassign_with_default = "allow"
# trait-impl plumbing sometimes returns Result on infallible paths
unnecessary_wraps = "allow"
# Copy-by-ref is sometimes deliberate for symmetry with trait signatures
trivially_copy_pass_by_ref = "allow"
# function-length budget judged case-by-case
too_many_lines = "allow"
# Option<Option<T>> is occasionally semantically meaningful (absent vs null)
option_option = "allow"
