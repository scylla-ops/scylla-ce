[workspace]
resolver = "2"
members = [
    "scylla-macros",
    "scylla-domain",
    "scylla-extension",
    "scylla-proto",
    "scylla-core",
    "scylla-testkit",
    "scylla-ce",
    "scylla-agent",
]

[workspace.package]
version = "0.7.0-rc.1"
edition = "2021"
rust-version = "1.94"
publish = false

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
missing_docs_in_private_items = "deny"

[workspace.dependencies]
scylla-agent = { path = "scylla-agent" }
scylla-ce = { path = "scylla-ce" }
scylla-core = { path = "scylla-core" }
scylla-domain = { path = "scylla-domain" }
scylla-extension = { path = "scylla-extension" }
scylla-macros = { path = "scylla-macros" }
scylla-proto = { path = "scylla-proto" }
scylla-testkit = { path = "scylla-testkit" }

argon2 = "0.6.0"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
biscuit-auth = { version = "6.0.0", default-features = false, features = ["datalog-macro"] }
chacha20poly1305 = { version = "0.11.0", features = ["getrandom"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
croner = "4.0.3"
deunicode = "1.6.2"
ed25519-dalek = "3.0.0"
gethostname = "1.1.0"
getrandom = "0.4.3"
globset = { version = "0.4.21", default-features = false }
hex = "0.4.3"
hmac = "0.13.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto", "use_pem"] }
nix = { version = "0.31.3", features = ["signal", "process", "user"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "rustls", "ring", "webpki-roots"] }
proc-macro2 = "1.0.107"
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "job-object", "creation-flags"] }
prost = "0.14.4"
prost-reflect = { version = "0.16.5", features = ["serde"] }
prost-types = "0.14.4"
quote = "1.0.47"
rcgen = "0.14.10"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "http2"] }
rustls = { version = "0.23.46", default-features = false, features = ["logging", "ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
schemars = "1.2.3"
serde-saphyr = { version = "2.1.1", default-features = false, features = ["serialize", "deserialize"] }
sha2 = "0.11.1"
spicedb-grpc-tonic = "1.0.0"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "macros", "migrate", "sqlx-toml", "uuid", "time", "json"] }
syn = "3.0.10"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "process", "io-util", "fs"] }
tokio-stream = "0.1.19"
toml = { version = "1.2.1", features = ["preserve_order"] }
tonic = { version = "0.14.9", default-features = false, features = ["codegen", "router", "transport", "tls-ring", "tls-webpki-roots", "tls-native-roots"] }
tonic-health = { version = "0.14.9", default-features = false }
tonic-prost = "0.14.9"
tonic-prost-build = { version = "0.14.9", default-features = false }
tonic-types = "0.14.9"
tonic-web = "0.14.9"
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "0.7.1", default-features = false, features = ["compression-br", "compression-gzip", "cors", "fs"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
url = "2.5.8"
uuid = { version = "1.29.2", features = ["v7"] }
windows = { version = "0.62.2", default-features = false, features = ["Win32_System_Threading"] }
windows-service = "0.8.1"

[profile.dev]
debug = 1

[profile.dev.package.sqlx-macros]
opt-level = 3
