[workspace]
resolver = "2"
members = [
    "scylla-domain",
    "scylla-extension",
    "scylla-proto",
    "scylla-core",
    "scylla-testkit",
    "scylla-ce",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
publish = false

[workspace.dependencies]
scylla-core = { path = "scylla-core" }
scylla-domain = { path = "scylla-domain" }
scylla-extension = { path = "scylla-extension" }
scylla-proto = { path = "scylla-proto" }
scylla-testkit = { path = "scylla-testkit" }

async-trait = "0.1.92"
prost = "0.14.4"
prost-types = "0.14.4"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "macros", "migrate", "sqlx-toml", "uuid", "time"] }
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "sync"] }
tonic = { version = "0.14.8", default-features = false, features = ["codegen", "router", "transport"] }
tonic-prost = "0.14.8"
tonic-prost-build = { version = "0.14.8", default-features = false }
tonic-types = "0.14.8"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "std"] }
uuid = { version = "1.29.0", features = ["v7"] }

[profile.dev]
debug = 1

[profile.dev.package.sqlx-macros]
opt-level = 3
