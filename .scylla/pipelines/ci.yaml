# The Linux checks of the agent of scylla-ce, run by the CI agent of the workspace Scylla Ops.
# GitHub shows the result as the check run `scylla/ci`. The label `linux` keeps these jobs off the
# Windows agent of the workspace. The Windows checks are in agent-windows.yaml, and the macOS
# checks stay in .github/workflows/agent.yml until a Mac agent joins.
version: 1
name: CI
on:
  push:
    branches: [main]
  pull_request: {}
agent:
  labels: [linux]
checkout:
  submodules: true
nodes:
  - id: clippy
    timeout_seconds: 3600
    env:
      SQLX_OFFLINE: "true"
    script: |
      set -eu
      . /usr/local/lib/scylla-ci/env.sh
      cargo clippy --locked -p scylla-agent --all-targets -- -D warnings
  - id: unit
    needs: [clippy]
    timeout_seconds: 3600
    env:
      SQLX_OFFLINE: "true"
    script: |
      set -eu
      . /usr/local/lib/scylla-ci/env.sh
      cargo test --locked -p scylla-agent --lib --bins
  - id: server
    needs: [unit]
    timeout_seconds: 3600
    env:
      SQLX_OFFLINE: "true"
    script: |
      set -eu
      . /usr/local/lib/scylla-ci/env.sh
      db="$CI_NAME-db" spicedb="$CI_NAME-spicedb"
      trap 'docker rm -f "$db" "$spicedb" >/dev/null 2>&1 || true' EXIT
      docker run -d --name "$db" --network "$CI_NETWORK" -e POSTGRES_USER=scylla -e POSTGRES_PASSWORD=scylla \
        -e POSTGRES_DB=scylla postgres:18-alpine postgres -c max_connections=500 -c fsync=off
      docker run -d --name "$spicedb" --network "$CI_NETWORK" authzed/spicedb:v1.57.0 serve-testing
      until docker exec "$db" pg_isready -U scylla -h 127.0.0.1 >/dev/null 2>&1; do sleep 1; done
      DATABASE_URL="postgres://scylla:scylla@$db:5432/scylla" \
      SCYLLA_TEST_SPICEDB_ENDPOINT="http://$spicedb:50051" \
        cargo test --locked -p scylla-agent
